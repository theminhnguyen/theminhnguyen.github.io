name: Deploy to GitHub Pages

# Läuft bei jedem Push auf main – und kann manuell gestartet werden.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Rechte, die der Deploy braucht
permissions:
  contents: read
  pages: write
  id-token: write

# Immer nur ein Deploy gleichzeitig. Laufende NICHT abbrechen, damit ein
# bereits gestartetes Deployment sauber zu Ende läuft (Empfehlung von GitHub
# für den Pages-Workflow).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache-Busting – Assets mit Commit-Hash versionieren
        run: |
          V="${GITHUB_SHA::8}"
          echo "Cache-Bust-Version: $V"
          # Alle lokalen CSS/JS-Referenzen in allen HTML-Seiten (auch Unterseiten
          # mit ../-Pfaden) bekommen ?v=<hash>, damit Browser nach jeder
          # Änderung garantiert neu laden.
          find . -name '*.html' -not -path './.git/*' -print0 | xargs -0 sed -i -E \
            "s#((href|src)=\"(\.\./)*(css|js|assets/fonts)/[a-z0-9-]+\.(css|js))\"#\1?v=${V}\"#g"
          echo "── Ergebnis ──"
          grep -rhoE "(css|js)/[a-z0-9-]+\.(css|js)\?v=[a-f0-9]+" --include='*.html' . | sort | uniq -c

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
