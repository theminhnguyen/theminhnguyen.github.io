<!DOCTYPE html>
<!-- Vorlage für assets/og-image.png (1200×630). {{PRODUCTS}} setzt tools/build-stats.js ein. -->
<html lang="de"><head><meta charset="utf-8">
<style>
@font-face { font-family: "Space Grotesk"; font-weight: 300 700; src: url(../assets/fonts/space-grotesk-latin.woff2) format("woff2"); }
@font-face { font-family: "Inter"; font-weight: 100 900; src: url(../assets/fonts/inter-latin.woff2) format("woff2"); }
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1200px; height: 630px; overflow: hidden; background: #06060b; font-family: Inter, sans-serif; color: #f4f4fb; position: relative; }
.b { position: absolute; border-radius: 50%; filter: blur(90px); }
.b1 { width: 620px; height: 620px; left: -160px; top: -200px; background: radial-gradient(circle, #6d28d9, transparent 70%); opacity: .6; }
.b2 { width: 560px; height: 560px; right: -140px; top: 120px; background: radial-gradient(circle, #0891b2, transparent 70%); opacity: .5; }
.b3 { width: 500px; height: 500px; left: 380px; bottom: -320px; background: radial-gradient(circle, #db2777, transparent 70%); opacity: .35; }
.grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px); background-size: 54px 54px; }
.wrap { position: relative; z-index: 2; display: flex; align-items: center; gap: 64px; height: 100%; padding: 0 90px; }
.ph { position: relative; flex-shrink: 0; }
.ph img { width: 250px; height: 250px; border-radius: 50%; object-fit: cover; border: 3px solid rgba(255,255,255,.18); box-shadow: 0 0 0 12px rgba(139,92,246,.14), 0 30px 80px -20px rgba(139,92,246,.8); }
.ph span { position: absolute; right: 6px; bottom: 10px; width: 64px; height: 64px; border-radius: 20px; display: grid; place-items: center; background: linear-gradient(120deg, #8b5cf6, #6d28d9); font-size: 30px; color: #fff; box-shadow: 0 10px 30px -6px rgba(139,92,246,.9); }
.name { font-family: "Space Grotesk"; font-size: 30px; color: #a2a2b8; margin-bottom: 14px; }
h1 { font-family: "Space Grotesk"; font-weight: 700; font-size: 76px; line-height: 1.02; letter-spacing: -.03em; }
.g { background: linear-gradient(110deg, #8b5cf6 10%, #22d3ee 55%, #f472b6 95%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.sub { margin-top: 22px; font-size: 25px; color: #a2a2b8; line-height: 1.4; max-width: 640px; }
.foot { position: absolute; left: 90px; bottom: 42px; z-index: 2; font-family: "Space Grotesk"; font-weight: 700; font-size: 24px; display: flex; align-items: center; gap: 10px; }
.foot i { font-style: normal; color: #8b5cf6; } .foot b { color: #22d3ee; }
</style></head><body>
<div class="b b1"></div><div class="b b2"></div><div class="b b3"></div><div class="grid"></div>
<div class="wrap">
  <div class="ph"><img src="../assets/portrait.jpg" alt=""><span>✦</span></div>
  <div>
    <p class="name">The Minh Nguyen</p>
    <h1>Erst ausprobieren.<br><span class="g">Dann skalieren.</span></h1>
    <p class="sub">Führe ein KI-Automatisierungsteam – und baue Ideen selbst. {{PRODUCTS}} Produkte zum Ausprobieren.</p>
  </div>
</div>
<div class="foot"><i>✦</i><span>minh<b>.</b>studio</span></div>
</body></html>
